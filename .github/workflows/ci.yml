name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - run: npm run check:exports
      # fetch-abis --check is added in 0.2.0, when generated ABIs land.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  smoke:
    # Dev tooling needs Node 22+, but the published package supports Node 18+.
    # This job installs the packed tarball into a fresh project on each runtime.
    name: Smoke test (Node ${{ matrix.node }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm pack
      - run: node scripts/smoke.mjs
