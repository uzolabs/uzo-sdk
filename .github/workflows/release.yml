name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing and provenance

jobs:
  integration:
    uses: ./.github/workflows/integration.yml

  release:
    name: Version PR or publish
    needs: integration
    runs-on: ubuntu-latest
    # Publishes via npm trusted publishing (OIDC). No npm token is stored anywhere.
    # The trusted publisher on npmjs.com is bound to this workflow and environment.
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build && npm run size
      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: 'chore: release'
          commit: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
