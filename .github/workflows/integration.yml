name: Integration

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  integration:
    name: Live RPC and explorer checks (read only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration
